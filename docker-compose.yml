# ローカル開発。リポジトリを bind mount して常駐させ、コンテナ内で作業する。
#
#   docker compose up -d
#   docker compose exec dev pnpm test
#   docker compose exec dev pnpm typecheck
#
# インフラ（ホスティング・マネージドDB）は決めない方針なので、ここにあるのは
# 開発環境だけ（docs/product-concept.md §4-0）。
services:
  dev:
    build:
      context: .
      target: dev
    container_name: alt-kintone-dev
    working_dir: /app
    # ホストの 3000 / 5173 は別プロジェクトのコンテナが使っているので避ける。
    # 3100 = API（pnpm serve）、5273 = FE の dev サーバー（フェーズ4で使う）。
    ports:
      - "3100:3000"
      - "5273:5173"
    volumes:
      - .:/app
      # 匿名ボリューム。上の bind mount が各パッケージの node_modules を
      # ホスト側の（空の）ディレクトリで覆い隠すのを防ぐ。
      # パッケージを追加したらここにも足すこと。
      - /app/node_modules
      - /app/apps/main/node_modules
      - /app/packages/cli/node_modules
      - /app/packages/definitions/node_modules
      - /app/packages/diff/node_modules
      - /app/packages/dsl/node_modules
      - /app/packages/server/node_modules
      - /app/packages/sql/node_modules
      - sqlite-data:/app/data
    environment:
      # alt apply のローカル適用先（docs/product-concept.md §4-0）
      DATABASE_URL: file:/app/data/alt.db
    init: true
    tty: true
    # API と FE は別々に上げる（落ちたときにどちらが死んだか分かるように）。
    #   docker compose exec -d dev pnpm serve   → localhost:3100
    #   docker compose exec -d dev pnpm dev     → localhost:5273
    command: sh -c "pnpm install && tail -f /dev/null"

volumes:
  sqlite-data:
